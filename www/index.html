<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RKM Manager</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #5A0F1A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!--
    This is only a local fallback screen — capacitor.config.ts points the WebView's
    server.url at the deployed manager app, so this file is not the real app and is
    rarely seen in practice (briefly, if ever, before the remote URL takes over).
  -->
  <div class="spinner"></div>
</body>
</html>
